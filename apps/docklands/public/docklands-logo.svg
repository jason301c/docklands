<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Docklands">
  <!-- Docklands logo — adaptive: ink flips with the OS/browser color scheme (favicon-safe).
       Three stacked containers; the brand-blue top bar is the "deploying" container. -->
  <style>
    .ink { fill: #171717; }
    @media (prefers-color-scheme: dark) { .ink { fill: #FFFFFF; } }
  </style>
  <rect class="ink" x="116" y="316" width="280" height="76" rx="20"/>
  <rect class="ink" x="116" y="222" width="280" height="76" rx="20"/>
  <rect x="116" y="128" width="280" height="76" rx="20" fill="#2F6BFF"/>
</svg>
