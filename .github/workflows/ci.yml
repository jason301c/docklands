# Continuous integration for the Docklands Bun workspace.
#
# Runs the repo's quality gates (lint, typecheck, tests, build) on every push
# and pull request targeting the long-lived branches. Bun is only the package
# manager / task runner here; the gates themselves execute app code on Node 24
# (the runtime Docklands ships on), so we install both toolchains.
name: CI

on:
  push:
    branches: [canary, main]
  pull_request:
    branches: [canary, main]

# Cancel an in-progress run when a newer commit is pushed to the same ref, so
# superseded PR/branch builds don't tie up runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: the gates only read the checkout.
permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    # The build (Turbopack + esbuild + Vitest) is the long pole; cap the whole
    # job generously so a hang fails fast rather than burning the default 6h.
    timeout-minutes: 30

    # Dummy secrets so `bun run build` (next build) and the test suite have the
    # env they expect without any real credentials. `build-next` already inlines
    # defaults for DATABASE_URL / BETTER_AUTH_SECRET, but we set safe values here
    # too so every gate sees a consistent, obviously-fake configuration. None of
    # these reach a real database, auth backend, or Docker daemon in CI.
    env:
      NODE_ENV: production
      DATABASE_URL: postgres://docklands_ci:docklands_ci@127.0.0.1:5432/docklands_ci
      BETTER_AUTH_SECRET: docklands-ci-secret-000000000000000000
      DOCKLANDS_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Bun drives install + every `bun run <script>` entrypoint. Pinned to the
      # version declared in the root package.json `packageManager` field.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Node 24 is the application runtime. Pin it from .nvmrc so CI matches the
      # supported `>=24.4.0 <26` range exactly.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Biome check, read-only (no --write) — fails on any lint/format drift.
      - name: Lint and format check
        run: bun run format-and-lint

      # next typegen + tsc --noEmit across the workspace.
      - name: Typecheck
        run: bun run typecheck

      # check:bundler + Vitest, excluding the real-deploy test (needs a Docker
      # socket and build tooling, which CI does not provision).
      - name: Test
        run: bun run test:ci

      # Kumo wraps Base UI compound components; incorrect composition often
      # fails only at render/click time, so keep the static scanner in CI.
      - name: Base UI composition scan
        run: bun run check:baseui

      - name: OpenAPI generation check
        run: bun run check:openapi

      # check:bundler + esbuild server bundle + next build (Turbopack).
      - name: Build
        run: bun run build

  docs-site:
    name: Docs and site
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Docs typecheck
        run: bun run docs:typecheck

      # `docs:build` also runs the stale public-claim scanner.
      - name: Docs build
        run: bun run docs:build

      - name: Site lint
        run: bun run site:lint

      - name: Site typecheck
        run: bun run site:typecheck

      - name: Site build
        run: bun run site:build

  # Apply every migration against a real Postgres to catch broken/ordering-
  # dependent migrations and snapshot drift — the unit suite mocks the DB, so it
  # never exercises the actual SQL. Running migrate twice also asserts the chain
  # is idempotent (the second pass applies nothing and must still exit 0).
  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: docklands_ci
          POSTGRES_PASSWORD: docklands_ci
          POSTGRES_DB: docklands_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docklands_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: production
      DATABASE_URL: postgres://docklands_ci:docklands_ci@127.0.0.1:5432/docklands_ci
      BETTER_AUTH_SECRET: docklands-ci-secret-000000000000000000
      DOCKLANDS_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      # The pre-migration backup needs no Docker socket on a fresh CI DB (it skips
      # when nothing is applied yet); skip it explicitly so the job stays hermetic.
      SKIP_PRE_MIGRATION_BACKUP: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply migrations
        run: bun run migration:run

      - name: Re-apply migrations (must be idempotent)
        run: bun run migration:run
