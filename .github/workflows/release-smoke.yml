# Manual release smoke for the Docker-backed deployment path.
#
# This is intentionally not part of routine CI. It mutates the runner's Docker
# daemon, initializes Swarm, installs Nixpacks, clones the selected ref over Git,
# builds images, and creates/removes Docker services.
name: Release smoke

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git branch or tag to checkout and clone for smoke fixtures.
        required: true
        default: canary
      git_url:
        description: Git URL used by the real deployment test.
        required: true
        default: https://github.com/jason301c/docklands.git

concurrency:
  group: release-smoke-${{ github.workflow }}-${{ inputs.git_ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  real-deploy:
    name: Real deploy smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      NODE_ENV: test
      DOCKLANDS_REAL_TEST_GIT_URL: ${{ inputs.git_url }}
      DOCKLANDS_REAL_TEST_GIT_BRANCH: ${{ inputs.git_ref }}
      NIXPACKS_VERSION: 1.41.0

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Nixpacks
        run: |
          curl -fsSL https://nixpacks.com/install.sh -o /tmp/install-nixpacks.sh
          NIXPACKS_VERSION="$NIXPACKS_VERSION" bash /tmp/install-nixpacks.sh --yes
          nixpacks --version | grep -F "$NIXPACKS_VERSION"

      - name: Prepare Docker Swarm
        run: |
          docker info
          if [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" != "active" ]; then
            docker swarm init --advertise-addr 127.0.0.1
          fi
          docker network inspect docklands-network >/dev/null 2>&1 || \
            docker network create --driver overlay --attachable docklands-network

      - name: Run real deployment test
        run: bun --filter docklands test -- --run __test__/deploy/application.real.test.ts

      - name: Cleanup Docker smoke resources
        if: always()
        run: |
          docker service ls --format '{{.Name}}' | grep '^real-' | xargs -r docker service rm
          docker image ls --format '{{.Repository}}:{{.Tag}}' | grep '^real-' | xargs -r docker rmi -f
          rm -rf apps/docklands/.docker
